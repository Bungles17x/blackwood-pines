    <meta property="og:title" content="Blackwood Pines" />

  <body>
    <div id="root"></div>
    <script>
      // Aggressively prevent and clear service workers
      (function() {
        // Prevent service worker registration
        if ('serviceWorker' in navigator) {
          const originalRegister = navigator.serviceWorker.register;
          navigator.serviceWorker.register = function() {
            console.warn('Service worker registration blocked for this application');
            return Promise.reject(new Error('Service worker registration is disabled'));
          };
          
          // Clear any existing service workers
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) {
              registration.unregister().then(function(success) {
                if (success) {
                  console.log('Service worker unregistered:', registration.scope);
                }
              });
            });
          });
          
          // Clear service worker caches
          if ('caches' in window) {
            caches.keys().then(function(cacheNames) {
              cacheNames.forEach(function(cacheName) {
                caches.delete(cacheName).then(function(success) {
                  if (success) {
                    console.log('Cache deleted:', cacheName);
                  }
                });
              });
            });
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
